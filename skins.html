<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WEAPON VAULT | ELITE AAYUSH</title>
    
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&family=Rajdhani:wght@500;700&display=swap');

        :root {
            --neon-orange: #ff4e00;
            --neon-yellow: #f5ed00;
            --bg-dark: #020202;
            --glow: 0 0 30px rgba(255, 78, 0, 0.7);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg-dark);
            color: #fff;
            font-family: 'Rajdhani', sans-serif;
            overflow-x: hidden;
            width: 100%;
        }

        /* Navigation */
        nav {
            display: flex; justify-content: space-between; align-items: center;
            padding: 15px 5%; background: rgba(0,0,0,0.95);
            border-bottom: 2px solid var(--neon-orange);
            position: fixed; width: 100%; z-index: 10000; backdrop-filter: blur(15px);
        }
        .logo { font-family: 'Orbitron'; font-size: clamp(1rem, 4vw, 1.5rem); color: var(--neon-yellow); font-weight: 900; letter-spacing: 2px; }

        .nav-links { list-style: none; }

        /* Sections */
        section { padding: 100px 5% 50px; min-height: 100vh; display: flex; flex-direction: column; align-items: center;}
        
        .massive-header {
            font-family: 'Orbitron'; font-size: clamp(1.8rem, 8vw, 5rem);
            text-transform: uppercase; margin-bottom: 30px; color: transparent; 
            -webkit-text-stroke: 1px #444; text-align: center;
        }
        .massive-header span { color: #fff; -webkit-text-stroke: 0px; text-shadow: var(--glow); }

        /* Gallery Grid */
        .gallery-container {
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px; width: 100%; max-width: 1200px;
        }

        .gun-card {
            background: #080808; border: 2px solid var(--neon-orange);
            padding: 15px; text-align: center; cursor: pointer; transition: 0.4s; border-radius: 5px;
            display: flex; flex-direction: column;
        }
        .gun-card:hover { transform: translateY(-5px); box-shadow: var(--glow); border-color: var(--neon-yellow); }

        .gun-card model-viewer { width: 100%; height: 220px; background: #000; margin-bottom: 10px; border-radius: 5px; }
        .gun-card h3 { font-family: 'Orbitron'; color: var(--neon-yellow); font-size: 1.2rem; }
        .gun-card p { color: #888; font-weight: bold; letter-spacing: 1px; font-size: 0.9rem; }

        /* Modal Area */
        #fullview-modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(2, 2, 2, 0.98); z-index: 20000; backdrop-filter: blur(10px);
        }

        .close-btn {
            position: absolute; top: 20px; right: 20px; background: var(--neon-orange);
            color: black; font-family: 'Orbitron'; font-weight: 900; padding: 10px 15px;
            cursor: pointer; z-index: 20005; clip-path: polygon(10% 0%, 100% 0%, 90% 100%, 0% 100%);
            border: none; font-size: 0.8rem;
        }

        /* Nav Buttons Base Style */
        .nav-btn {
            position: absolute; top: 50%; transform: translateY(-50%);
            background: transparent;
            color: var(--neon-orange);
            border: none;
            font-family: 'Orbitron', sans-serif;
            font-size: 4rem;
            cursor: pointer; z-index: 20001;
            transition: 0.3s ease;
            text-shadow: 0 0 15px var(--neon-orange);
            user-select: none;
        }

        .prev { left: 30px; }
        .next { right: 30px; }

        /* Bottom Info & Navigation Container */
        .modal-footer {
            position: absolute; bottom: 40px; width: 100%;
            display: flex; align-items: center; justify-content: center;
            gap: 20px; padding: 0 20px; z-index: 20002;
        }

        .modal-info { text-align: center; pointer-events: none; }
        .modal-info h2 { color: var(--neon-yellow); font-size: clamp(1.2rem, 5vw, 2.5rem); text-shadow: 0 0 10px #000; }
        .modal-info p { color: #fff; letter-spacing: 2px; font-size: clamp(0.8rem, 3vw, 1.2rem); }

        .elite-btn {
            background: var(--neon-orange); color: #000; padding: 8px 15px;
            font-family: 'Orbitron'; font-weight: 900; text-decoration: none;
            clip-path: polygon(10% 0, 100% 0, 90% 100%, 0 100%);
            display: inline-block; font-size: 0.8rem;
        }

        .status-msg {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            font-family: 'Orbitron'; color: var(--neon-yellow); font-size: 1rem; pointer-events: none;
            text-align: center; width: 100%;
        }

        /* --- MOBILE & TABLET ADAPTATION --- */
        @media (max-width: 768px) {
            /* Arrows moved from sides to bottom next to name */
            .nav-btn {
                position: static; /* Remove absolute positioning */
                transform: none;
                font-size: 2rem;
                background: #111;
                border: 2px solid var(--neon-orange);
                width: 60px; height: 60px;
                display: flex; align-items: center; justify-content: center;
                border-radius: 10px;
                box-shadow: 0 0 10px var(--neon-orange);
            }
            
            .modal-footer {
                bottom: 20px;
                justify-content: space-between; /* Space between: Arrow - Info - Arrow */
                background: rgba(0,0,0,0.6);
                padding: 15px;
                backdrop-filter: blur(5px);
                border-top: 1px solid #333;
            }

            .gallery-container { grid-template-columns: 1fr; }
            section { padding-top: 90px; }
            
            .modal-info h2 { font-size: 1.2rem; }
            .modal-info p { font-size: 0.7rem; }
        }
    </style>
</head>
<body>

    <nav>
        <div class="logo">AAYUSH PRO</div>
        <ul class="nav-links">
            <li><a href="index.html" class="elite-btn">LOBBY</a></li>
        </ul>
    </nav>

    <section>
        <h1 class="massive-header">WEAPON <span>VAULT</span></h1>
        <div class="gallery-container" id="gallery"></div>
    </section>

    <div id="fullview-modal">
        <button class="close-btn" onclick="closeGun()">CLOSE [X]</button>
        
        <div class="modal-footer">
            <button class="nav-btn prev" onclick="changeGun(-1)">&#11164;</button>
            
            <div class="modal-info" id="gun-details">
                </div>
            
            <button class="nav-btn next" onclick="changeGun(1)">&#11166;</button>
        </div>

        <div id="status-display" class="status-msg"></div>
        <div id="viewer-container" style="width: 100%; height: 100%;"></div>
    </div>

    <script>
        const guns = [
            { file: 'gun1.glb', name: 'EVO XM8', skin: 'GUARDIAN SKIN' },
            { file: 'gun2.glb', name: 'MP40', skin: 'COBRA MAX' },
            { file: 'gun3.glb', name: 'M1887', skin: 'ONE PUNCH' },
            { file: 'gun4.glb', name: 'AWM', skin: 'GHOST SKIN' },
            { file: 'gun5.glb', name: 'KATANA', skin: 'BLOOD MOON' }
        ];

        let currentGunIndex = 0;

        const gallery = document.getElementById('gallery');
        guns.forEach((gun, index) => {
            gallery.innerHTML += `
                <div class="gun-card" onclick="openGun(${index})">
                    <model-viewer src="${gun.file}" auto-rotate interaction-prompt="none" shadow-intensity="1"></model-viewer>
                    <h3>${gun.name}</h3>
                    <p>${gun.skin}</p>
                </div>
            `;
        });

        function openGun(index) {
            currentGunIndex = index;
            const modal = document.getElementById('fullview-modal');
            const container = document.getElementById('viewer-container');
            const details = document.getElementById('gun-details');
            const status = document.getElementById('status-display');
            
            modal.style.display = 'block';
            document.body.style.overflow = 'hidden';
            status.innerHTML = "LOADING WEAPON...";

            // Set Details
            details.innerHTML = `
                <h2>${guns[index].name}</h2>
                <p>${guns[index].skin}</p>
            `;

            // Set 3D Model
            container.innerHTML = `
                <model-viewer 
                    id="full-viewer"
                    src="${guns[index].file}" 
                    camera-controls 
                    auto-rotate
                    shadow-intensity="2"
                    exposure="1.2"
                    touch-action="pan-y"
                    style="width: 100%; height: 100%;">
                </model-viewer>
            `;

            const viewer = document.getElementById('full-viewer');
            viewer.addEventListener('load', () => { status.innerHTML = ""; });
        }

        function changeGun(step) {
            currentGunIndex += step;
            if (currentGunIndex >= guns.length) currentGunIndex = 0;
            if (currentGunIndex < 0) currentGunIndex = guns.length - 1;
            openGun(currentGunIndex);
        }

        function closeGun() {
            document.getElementById('fullview-modal').style.display = 'none';
            document.getElementById('viewer-container').innerHTML = ''; 
            document.body.style.overflow = 'auto';
        }

        window.addEventListener('keydown', (e) => {
            if (e.key === "Escape") closeGun();
        });
    </script>
</body>
</html>
